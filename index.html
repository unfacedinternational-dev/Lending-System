<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lending System</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            min-height: 100%;
            font-family: Arial, sans-serif;
            background: #f0f0f0;
        }

        #main-view {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .claim-btn {
            padding: 16px 30px;
            font-size: 20px;
            background: #007bff;
            color: #fff;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
        }

        #lockdown-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #111827;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .unlock-panel {
            width: min(420px, 100%);
            background: #fff;
            padding: 32px;
            border-radius: 14px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,.25);
        }

        .instruction-text {
            font-size: 24px;
            font-weight: 700;
            color: #222;
            margin-bottom: 20px;
        }

        .pin-btn {
            padding: 13px 22px;
            font-size: 16px;
            background: #333;
            color: #fff;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
        }

        .close-btn {
            display: block;
            margin: 14px auto 0;
            padding: 10px 18px;
            background: transparent;
            color: #555;
            border: 1px solid #ccc;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="main-view">
        <button class="claim-btn" onclick="activateSiren()">Access System</button>
    </div>

    <div id="lockdown-overlay" aria-hidden="true">
        <div class="unlock-panel">
            <div class="instruction-text">System Security Check</div>
            <button class="pin-btn" onclick="requestPin()">Enter Admin PIN</button>
            <button class="close-btn" onclick="closeSecurityCheck()">Close</button>
        </div>
    </div>

    <script>
        // Demo PIN only. This is NOT secure authentication.
        const ADMIN_PIN = "1984";

        const mainView = document.getElementById("main-view");
        const lockdownOverlay = document.getElementById("lockdown-overlay");

        function activateSiren() {
            mainView.style.display = "none";
            lockdownOverlay.style.display = "flex";
            lockdownOverlay.setAttribute("aria-hidden", "false");
        }

        function closeSecurityCheck() {
            lockdownOverlay.style.display = "none";
            lockdownOverlay.setAttribute("aria-hidden", "true");
            mainView.style.display = "flex";
        }

        function requestPin() {
            const userInput = prompt("Enter Admin PIN:");

            if (userInput === ADMIN_PIN) {
                closeSecurityCheck();
                alert("System Access Restored.");
            } else if (userInput !== null) {
                alert("Access Denied. Invalid PIN.");
            }
        }

        // ESC always closes the security overlay.
        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape" && lockdownOverlay.style.display === "flex") {
                closeSecurityCheck();
            }
        });
    </script>
</body>
</html>
